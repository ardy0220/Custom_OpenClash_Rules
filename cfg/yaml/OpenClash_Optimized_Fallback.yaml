# Custom_OpenClash_Rules
# OpenClash 分流配置（优先就近线路，支持跨地区故障切换）
# 项目地址：https://github.com/Aethersailor/Custom_OpenClash_Rules

# ==================== 代理提供者 Proxy Providers ====================
proxy-providers:
  精灵学院:
    type: http
    url: ""  # 填入订阅链接 1
    interval: 3600
    path: ./proxy_provider/provider1.yaml
    proxy: DIRECT
    filter: "^(?!.*(DIRECT|直接连接|群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author|Traffic|GB|Expire)).*$"
    #header:
    health-check:
      enable: true
      url: https://cp.cloudflare.com/generate_204
      interval: 120
      timeout: 4000
      lazy: false
      expected-status: 204
    override:
      udp: true


# ==========================================
# 统一节点源锚点（多订阅集中管理）
# ==========================================
providers: &providers
  use:
    - 精灵学院
   # - 千速云

# ========================
# 策略组定义
# ========================
default: &default
  type: select
  proxies:
    - "跨区故转"
    - "AI 地区故转"
    - "全球直连"
    - "香港故转"
    - "美国故转"
    - "日本故转"
    - "新加坡故转"
    - "台湾故转"
    - "韩国故转"
    - "加拿大故转"
    - "英国故转"
    - "法国故转"
    - "德国故转"
    - "荷兰故转"
    - "土耳其故转"
    - "俄罗斯故转"
    - "其他地区故转"
    - "香港自动"
    - "美国自动"
    - "日本自动"
    - "新加坡自动"
    - "台湾自动"
    - "韩国自动"
    - "加拿大自动"
    - "英国自动"
    - "法国自动"
    - "德国自动"
    - "荷兰自动"
    - "土耳其自动"
    - "俄罗斯自动"
    - "其他地区自动"
    - "拒绝"

proxy-groups:
  # 先从各地区挑选节点，再按地区顺序切换。全部节点组补足未列出的地区。
  - name: "跨区故转"
    type: fallback
    proxies:
      - "香港自动"
      - "日本自动"
      - "新加坡自动"
      - "台湾自动"
      - "全部节点自动"
    url: https://cp.cloudflare.com/generate_204
    interval: 90
    timeout: 4500
    max-failed-times: 2
    lazy: false
    expected-status: 204

  - name: "全部节点自动"
    type: url-test
    <<: *providers
    empty-fallback: REJECT
    tolerance: 50

  # AI 服务优先美国，无法通过探测时尝试其他指定地区。
  - name: "AI 地区故转"
    type: fallback
    proxies:
      - "美国自动"
      - "日本自动"
      - "新加坡自动"
      - "台湾自动"
    url: https://cp.cloudflare.com/generate_204
    interval: 90
    timeout: 4500
    max-failed-times: 2
    expected-status: 204

  #  分类策略组
  - { name: Chat, <<: *default }
  - { name: Media, <<: *default }
  - { name: Trade, <<: *default }
  - { name: YouTube, <<: *default }
  - { name: TikTok, <<: *default }
  - { name: Netflix, <<: *default }
  - { name: HBO, <<: *default }
  - { name: Disney, <<: *default }
  - { name: Test, <<: *default }
  # AI 业务默认用 AI 地区故转，面板可固定地区。
  - { name: ChatGPT, <<: *default, default-selected: "AI 地区故转" }
  - { name: Claude, <<: *default, default-selected: "AI 地区故转" }
  - { name: Gemini, <<: *default, default-selected: "AI 地区故转" }
  - { name: Copilot, <<: *default, default-selected: "AI 地区故转" }
  - { name: Perplexity, <<: *default, default-selected: "AI 地区故转" }
  - { name: Meta AI, <<: *default, default-selected: "AI 地区故转" }
  - { name: Spotify, <<: *default }
  - { name: AppleIntelligence, <<: *default, default-selected: "AI 地区故转" }
  - { name: Truth, <<: *default }
  - { name: Twitter, <<: *default }
  # 社交与通讯业务各自选择出口
  - { name: Telegram, <<: *default }
  - { name: Discord, <<: *default }
  - { name: Reddit, <<: *default }
  - { name: WhatsApp, <<: *default }
  - { name: Facebook, <<: *default }
  - { name: GitHub, <<: *default }
  - { name: Nvidia, <<: *default }
  - { name: OpenWrt, <<: *default }
  - { name: Popcorn, <<: *default }
  # Apple 和特殊业务默认直连
  - { name: Apple, <<: *default, default-selected: "全球直连" }
  - { name: Special, <<: *default, default-selected: "全球直连" }
  - { name: Steam, <<: *default }
  - { name: Steam_CDN_Domain, <<: *default, default-selected: "全球直连" }
  - { name: Steam_CDN_IP, <<: *default, default-selected: "全球直连" }
  # 交易与其他业务可单独选择地区
  - { name: Crypto, <<: *default }
  - { name: Crunchyroll, <<: *default }
  #  通用默认策略组
  - { name: Amazon, <<: *default }
  - { name: Games, <<: *default }
  - { name: Apple-CN, <<: *default, default-selected: "全球直连" }
  - { name: Google, <<: *default }
  - { name: Microsoft, <<: *default }
  - { name: Adobe, <<: *default }
  - { name: 国外, <<: *default }
  - { name: 国内, <<: *default, default-selected: "全球直连" }
  - { name: 其他, <<: *default }

  # ---------------- 香港地区 ----------------
  - name: "香港手动"
    type: select
    filter: &region_1 '(?i)(🇭🇰|港|\bHK(?:[-_ ]?\d+(?:[-_ ]?[A-Za-z]{2,})?)?\b|hk|Hong Kong|HongKong|hongkong|HONG KONG|HONGKONG|深港|HKG|九龙|Kowloon|新界|沙田|荃湾|葵涌)'
