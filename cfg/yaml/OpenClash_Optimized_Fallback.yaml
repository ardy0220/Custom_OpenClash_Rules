# Custom_OpenClash_Rules
# OpenClash 分流配置（优先就近线路，支持跨地区故障切换）
# 项目地址：https://github.com/Aethersailor/Custom_OpenClash_Rules
  # 使用 Mihomo 内核；DNS、嗅探、IPv6、运行模式及控制器由 OpenClash LuCI 管理。
# 已保存的面板选择可能覆盖首次默认值；应用后检查“国内”和各业务组的实际选择。

# ==================== 代理提供者 Proxy Providers ====================
proxy-providers:
  精灵学院:
    type: http
    url: ""  # 填入订阅链接 1
    interval: 3600
    path: ./proxy_provider/provider1.yaml
    # 首次下载必须有可达出口；已有节点缓存且订阅无法直连时，可改为“跨区故转”。
    # 不默认引用自身订阅构成的策略组，避免首次启动循环依赖。
    proxy: DIRECT
    # 仅排除明确的公告格式；不再按 GB、备用、国内等普通子串删除节点。
    exclude-filter: '(?i)(^(?:DIRECT|直接连接)$|^(?:剩余流量|套餐到期|到期时间|订阅更新|官网地址|官方公告|流量重置|Traffic Remaining|Expire Date)\s*[:：])'
    #header:
    health-check:
      enable: true
      url: https://cp.cloudflare.com/generate_204
      interval: 120
      timeout: 4000
      lazy: false
      expected-status: 204
    # 保留订阅声明的 UDP 能力，不统一强制开启。


# ==========================================
# 统一节点源锚点（多订阅集中管理）
# ==========================================
providers: &providers
  use:
    - 精灵学院
    # - 千速云

# ========================
# 策略组定义
# ========================
