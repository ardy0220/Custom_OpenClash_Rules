    - "荷兰故转"
    - "土耳其故转"
    - "俄罗斯故转"
    - "其他地区故转"
    - "香港自动"
    - "美国自动"
    - "日本自动"
    - "新加坡自动"
    - "台湾自动"
    - "韩国自动"
    - "加拿大自动"
    - "英国自动"
    - "法国自动"
    - "德国自动"
    - "荷兰自动"
    - "土耳其自动"
    - "俄罗斯自动"
    - "其他地区自动"
    - "香港手动"
    - "美国手动"
    - "日本手动"
    - "新加坡手动"
    - "台湾手动"
    - "韩国手动"
    - "加拿大手动"
    - "英国手动"
    - "法国手动"
    - "德国手动"
    - "荷兰手动"
    - "土耳其手动"
    - "俄罗斯手动"
    - "其他地区手动"
    - "全部节点手动"
    - "🏠 家宽节点"
    - "🐢 低倍率节点"
    - "拒绝"

# AI 与直连业务各自将默认出口放在首位，减少对 default-selected 的依赖。
ai-default: &ai_default
  type: select
  proxies:
    - "AI 地区故转"
    - "美国手动"
    - "日本手动"
    - "新加坡手动"
    - "台湾手动"
    - "全部节点手动"
    - "全球直连"
    - "拒绝"

direct-default: &direct_default
  type: select
  proxies:
    - "全球直连"
    - "跨区故转"
    - "全部节点手动"
    - "拒绝"

# 社交通讯、Amazon 和 Games 按地区优先级自动故转；各业务独立检测。
regional-fallback: &regional_fallback
  type: fallback
  proxies:
    - "香港自动"
    - "新加坡自动"
    - "日本自动"
    - "韩国自动"
    - "美国自动"
    - "台湾自动"
    - "加拿大自动"
    - "英国自动"
    - "法国自动"
    - "德国自动"
    - "荷兰自动"
    - "土耳其自动"
    - "俄罗斯自动"
    - "其他地区自动"
    - "全部节点自动"
  url: https://cp.cloudflare.com/generate_204
  interval: 90
  timeout: 4500
  max-failed-times: 2
  lazy: false
  expected-status: 204

proxy-groups:
  # 通用检测仅判断网络连通，不判断 AI/流媒体解锁或账号可用性。
  # 所有候选失效时 fallback 仍尝试首项；empty-fallback 仅用于过滤后无节点。
  # 先从各地区挑选节点，再按地区顺序切换。全部节点组补足未列出的地区。
  - name: "跨区故转"
    type: fallback
    proxies:
      - "香港自动"
      - "日本自动"
      - "新加坡自动"
      - "台湾自动"
      - "全部节点自动"
    url: https://cp.cloudflare.com/generate_204
    interval: 90
    timeout: 4500
    max-failed-times: 2
    lazy: false
    expected-status: 204

  # 业务限制、出口 IP 固定需求可在面板选择此组并指定单个节点。
  - name: "全部节点手动"
    type: select
    <<: *providers
    empty-fallback: REJECT

  - name: "全部节点自动"
    type: url-test
    <<: *providers
    empty-fallback: REJECT
    tolerance: 50

  # AI 服务仅在指定地区切换；Cloudflare 检测不能判断服务是否封锁出口 IP。
  # 遇到业务不可用或需要稳定会话时，在业务组手动固定已验证的节点。
  - name: "AI 地区故转"
    type: fallback
    proxies:
      - "美国自动"
      - "日本自动"
      - "新加坡自动"
      - "台湾自动"
    url: https://cp.cloudflare.com/generate_204
    interval: 90
    timeout: 4500
    max-failed-times: 2
    lazy: false
    expected-status: 204

  #  分类策略组
  - { name: Trade, <<: *default }
  - { name: YouTube, <<: *default }
  - { name: TikTok, <<: *default }
  - { name: Netflix, <<: *default }
  - { name: EmbyDirect, <<: *direct_default }
  - { name: EmbyProxy, <<: *default }
  - { name: HBO, <<: *default }
  - { name: Disney, <<: *default }
  - { name: Test, <<: *default }
  # AI 业务默认用 AI 地区故转，面板可固定地区。
  - { name: ChatGPT, <<: *ai_default }
  - { name: Claude, <<: *ai_default }
  - { name: Gemini, <<: *ai_default }
  - { name: Copilot, <<: *ai_default }
  - { name: Perplexity, <<: *ai_default }
  - { name: Meta AI, <<: *ai_default }
  - { name: Spotify, <<: *default }
  # Apple Intelligence 使用 AI 策略，独立于 Apple 常规服务出口。
  - { name: AppleIntelligence, <<: *ai_default }
  - { name: Truth, <<: *regional_fallback }
  - { name: Twitter, <<: *regional_fallback }
  # 社交与通讯按香港、新加坡、日本、韩国、美国等顺序自动故转
  - { name: Telegram, <<: *regional_fallback }
  - { name: Discord, <<: *regional_fallback }
  - { name: Reddit, <<: *regional_fallback }
  - { name: WhatsApp, <<: *regional_fallback }
  - { name: Facebook, <<: *regional_fallback }
  - { name: GitHub, <<: *default }
  - { name: Nvidia, <<: *default }
  - { name: OpenWrt, <<: *default }
  - { name: Popcorn, <<: *default }
  # Apple 按新加坡、香港、国内顺序故转；国内出口与 Apple-CN 一致（默认直连）。
  # 检测仅判断网络连通，不判断 Apple Intelligence 的地区或账号可用性。
  - name: Apple
    type: fallback
    proxies:
      - "新加坡故转"
      - "香港故转"
      - "国内"
    url: https://cp.cloudflare.com/generate_204
    interval: 90
    timeout: 4500
    max-failed-times: 2
    lazy: false
    expected-status: 204
  # 特殊业务默认直连
  - { name: Special, <<: *direct_default }
  - { name: Steam, <<: *default }
  - { name: Steam_CDN_Domain, <<: *direct_default }
  - { name: Steam_CDN_IP, <<: *direct_default }
  # 交易与其他业务可单独选择地区
  - { name: Crypto, <<: *default }
  - { name: Crunchyroll, <<: *default }
  #  通用默认策略组
  - { name: Amazon, <<: *regional_fallback }
  - { name: Games, <<: *regional_fallback }
  # 国内适用的 Apple 服务跟随“国内”（默认直连），不继承 Apple 跨区出口。
  - { name: Apple-CN, type: select, proxies: [国内] }
  - { name: Google, <<: *default }
  - { name: Microsoft, <<: *default }
  - { name: Adobe, <<: *default }
  - { name: 国外, <<: *default }
  - { name: 国内, <<: *direct_default }
  - { name: 其他, <<: *default }

  # ---------------- 香港地区 ----------------
  - name: "香港手动"
    type: select
    filter: &region_1 '(?i)(🇭🇰|港|\bHK(?:[-_ ]?\d+(?:[-_ ]?[A-Za-z]{2,})?)?\b|Hong Kong|HongKong|hongkong|HONG KONG|HONGKONG|深港|\bHKG\b|九龙|Kowloon|新界|沙田|荃湾|葵涌)'
