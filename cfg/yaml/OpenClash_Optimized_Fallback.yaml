    filter: &region_14 '(?i)^(?!.*(?:(🇭🇰|港|\bHK(?:[-_ ]?\d+(?:[-_ ]?[A-Za-z]{2,})?)?\b|Hong Kong|HongKong|hongkong|HONG KONG|HONGKONG|深港|\bHKG\b|九龙|Kowloon|新界|沙田|荃湾|葵涌)|(🇺🇸|美国|美(?=[-_ 0-9])|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|纽约|纽纽|亚特兰大|迈阿密|华盛顿|\bUS(?:[-_ ]?\d+(?:[-_ ]?[A-Za-z]{2,})?)?\b|United States|UnitedStates|UNITED STATES|\bUSA\b|America|AMERICA|\bJFK\b|\bEWR\b|\bIAD\b|\bATL\b|\bORD\b|\bMIA\b|\bNYC\b|\bLAX\b|\bSFO\b|\bSEA\b|\bDFW\b|\bSJC\b)|(🇯🇵|日本|川日|东京|大阪|泉日|埼玉|沪日|深日|日(?=[-_ 0-9])|\bJP(?:[-_ ]?\d+(?:[-_ ]?[A-Za-z]{2,})?)?\b|Japan|JAPAN|\bJPN\b|\bNRT\b|\bHND\b|\bKIX\b|\bTYO\b|\bOSA\b|关西|Kansai|KANSAI)|(🇸🇬|新加坡|坡(?=[-_ 0-9])|狮城|\bSG(?:[-_ ]?\d+(?:[-_ ]?[A-Za-z]{2,})?)?\b|Singapore|SINGAPORE|\bSIN\b)|(🇹🇼|🇼🇸|台湾|台灣|台(?=[-_ 0-9])|新北|彰化|\bTW(?:[-_ ]?\d+(?:[-_ ]?[A-Za-z]{2,})?)?\b|Taiwan|TAIWAN|\bTWN\b|\bTPE\b|\bROC\b)|(🇰🇷|\bKR(?:[-_ ]?\d+(?:[-_ ]?[A-Za-z]{2,})?)?\b|Korea|KOREA|\bKOR\b|首尔|韩|韓|春川|Chuncheon|\bICN\b)|(🇨🇦|加拿大|\bCA(?:[-_ ]?\d+(?:[-_ ]?[A-Za-z]{2,})?)?\b|Canada|CANADA|\bCAN\b|渥太华|温哥华|卡尔加里|蒙特利尔|Montreal|\bYVR\b|\bYYZ\b|\bYUL\b)|(🇬🇧|英国|Britain|United Kingdom|UNITED KINGDOM|England|伦敦|曼彻斯特|Manchester|\bUK(?:[-_ ]?\d+(?:[-_ ]?[A-Za-z]{2,})?)?\b|\bGBR\b|\bLHR\b|\bMAN\b)|(🇫🇷|法国|\bFR(?:[-_ ]?\d+(?:[-_ ]?[A-Za-z]{2,})?)?\b|France|FRANCE|\bFRA\b|巴黎|马赛|Marseille|\bCDG\b|\bMRS\b)|(🇩🇪|德国|Germany|GERMANY|\bDE(?:[-_ ]?\d+(?:[-_ ]?[A-Za-z]{2,})?)?\b|\bDEU\b|柏林|法兰克福|慕尼黑|Munich|\bMUC\b)|(🇳🇱|荷兰|Netherlands|NETHERLANDS|\bNL(?:[-_ ]?\d+(?:[-_ ]?[A-Za-z]{2,})?)?\b|\bNLD\b|阿姆斯特丹|\bAMS\b)|(🇹🇷|土耳其|Turkey|TURKEY|Türkiye|\bTR(?:[-_ ]?\d+(?:[-_ ]?[A-Za-z]{2,})?)?\b|\bTUR\b|\bIST\b|\bANK\b)|(🇷🇺|(?<!白)俄罗斯|(?<!白)俄|莫斯科|圣彼得堡|新西伯利亚|海参崴|符拉迪沃斯托克|哈巴罗夫斯克|伯力|\bRU(?:[-_ ]?\d+)?\b|Russia))).*$'
    <<: *providers
    empty-fallback: REJECT

  - name: "其他地区自动"
    type: url-test
    filter: *region_14
    <<: *providers
    empty-fallback: REJECT
    tolerance: 50

  - name: "其他地区故转"
    type: fallback
    filter: *region_14
    <<: *providers
    empty-fallback: REJECT
    max-failed-times: 2

  # ---------------- 辅助分类 ----------------
  - name: "🏠 家宽节点"
    type: url-test
    filter: '(?i)(家宽|家庭宽带|住宅|Residential)'
    <<: *providers
    empty-fallback: REJECT
    tolerance: 50

  - name: "🐢 低倍率节点"
    type: url-test
    filter: '(?i)(低倍率|低倍|(?<![\d.])0?\.\d+\s*(?:x|倍)(?![A-Za-z0-9])|倍率\s*[:：]?\s*0?\.\d+(?![0-9]))'
    <<: *providers
    empty-fallback: REJECT
    tolerance: 50

  - name: "全球直连"
    type: select
    proxies:
      - DIRECT

  - name: "拒绝"
    type: select
    proxies:
      - REJECT

# ========================
# 规则引擎（rules）
# ========================
rules:
  # 局域网和明确的自定义规则优先。
  - RULE-SET,Private / Domain,DIRECT
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR6,::1/128,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve
  - RULE-SET,Custom_Proxy_Domain / Domain,国外
  - RULE-SET,Custom_Direct_Domain / Domain,DIRECT
  - RULE-SET,Custom_Proxy_IP / IP,国外,no-resolve
  - RULE-SET,Custom_Direct_IP / IP,DIRECT,no-resolve
  - RULE-SET,Custom_Direct_Port / Domain,DIRECT
  - RULE-SET,Block / Domain,REJECT

  # Steam CDN 满速直连
  - RULE-SET,Steam_CDN_Domain / Domain,Steam_CDN_Domain
  - RULE-SET,Steam_CDN_IP / IP,Steam_CDN_IP,no-resolve

  # Intelligence 专用规则优先并使用 AI 策略；Apple-CN 跟随国内，其余 Apple 按新加坡/香港/国内故转。
  # Apple 分类先于通用 cn 集合，防止非 Apple-CN 的 Apple 流量被国内兜底覆盖。
  - RULE-SET,AppleIntelligence / Domain,AppleIntelligence
  - RULE-SET,Apple-CN / Domain,Apple-CN
  - RULE-SET,Apple-Custom / Domain,Apple
  - RULE-SET,Apple / Domain,Apple

  # 已确认国内域名优先分类；cn 集合包含 bilivideo.com 及其子域名。
  # 放在第三方业务和通用代理规则之前，避免国内 CDN 被宽泛规则抢先匹配。
  - RULE-SET,EmbyDirect,EmbyDirect
  - RULE-SET,EmbyProxy,EmbyProxy
  - RULE-SET,China / Domain,国内

  # 连通性测试
  - RULE-SET,Test / Domain,Test

  # AI 业务（美国优先，可在指定地区故转或手动固定节点）
  - RULE-SET,ChatGPT / Domain,ChatGPT
  - RULE-SET,Claude / Domain,Claude
  - RULE-SET,Meta AI / Domain,Meta AI
  - RULE-SET,Perplexity / Domain,Perplexity
  - RULE-SET,Copilot / Domain,Copilot
  - RULE-SET,Gemini / Domain,Gemini
  - RULE-SET,Groq / Domain,ChatGPT
  - RULE-SET,Grok / Domain,ChatGPT

  # 社交 / 通讯
  - RULE-SET,Telegram / Domain,Telegram
  - RULE-SET,Telegram / IP,Telegram,no-resolve
  - RULE-SET,WhatsApp / Domain,WhatsApp
  - RULE-SET,Facebook / Domain,Facebook
  - RULE-SET,Discord / Domain,Discord
  - RULE-SET,Twitter / Domain,Twitter
  - RULE-SET,Reddit / Domain,Reddit
  - RULE-SET,Truth / Domain,Truth

  # 影音流媒体
  - RULE-SET,YouTube / Domain,YouTube
  - RULE-SET,TikTok / Domain,TikTok
  - RULE-SET,Netflix / Domain,Netflix
  - RULE-SET,Netflix / IP,Netflix,no-resolve
  - RULE-SET,Disney / Domain,Disney
  - RULE-SET,HBO / Domain,HBO
  - RULE-SET,Spotify / Domain,Spotify
  - RULE-SET,Crunchyroll / Domain,Crunchyroll
  - RULE-SET,Popcorn / Domain,Popcorn

  # 游戏 / 平台
  - RULE-SET,Steam / Domain,Steam
  - RULE-SET,Epic / Domain,Games
  - RULE-SET,EA / Domain,Games
  - RULE-SET,Blizzard / Domain,Games
  - RULE-SET,UBI / Domain,Games
  - RULE-SET,PlayStation / Domain,Games
  - RULE-SET,Nintendo / Domain,Games
  - RULE-SET,NC / Domain,Games

  # 加密货币 / 交易
  - RULE-SET,Crypto / Domain,Crypto
  - RULE-SET,OKX / Domain,Trade
  - RULE-SET,Bybit / Domain,Trade
  - RULE-SET,Binance / Domain,Trade
  - RULE-SET,Trade / Domain,Trade

  # 科技与开发
  - RULE-SET,GitHub / Domain,GitHub
  - RULE-SET,Microsoft / Domain,Microsoft
  - RULE-SET,Google / Domain,Google
  - RULE-SET,Google / IP,Google,no-resolve
  - RULE-SET,Nvidia / Domain,Nvidia
  - RULE-SET,Amazon / Domain,Amazon
  - RULE-SET,Adobe / Domain,Adobe
  - RULE-SET,AdobeActivation / Domain,Adobe
  - RULE-SET,OpenWrt / Domain,OpenWrt

  # 其他娱乐/专项
  - RULE-SET,Special / Domain,Special
  - RULE-SET,Sex / Domain,国外

  # 业务规则优先；通用直连补充先于通用代理，未知流量交给“其他”。
  - RULE-SET,Direct / Domain,国内
  - RULE-SET,Proxy / Domain,国外
  - RULE-SET,Globe / Domain,国外
  - RULE-SET,China / IP,国内,no-resolve
  - MATCH,其他

# ==========================================
# 规则集通用基础锚点
# ==========================================
rule-anchor:
  ip: &ip { type: http, interval: 86400, behavior: ipcidr, format: mrs }
  domain: &domain { type: http, interval: 86400, behavior: domain, format: mrs }
  class: &class { type: http, interval: 86400, behavior: classical, format: text }
  class_yaml: &class_yaml { type: http, interval: 86400, behavior: classical, format: yaml }

