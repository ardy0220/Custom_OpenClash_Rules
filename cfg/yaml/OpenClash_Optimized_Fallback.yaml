      - DIRECT

  - name: "拒绝"
    type: select
    proxies:
      - REJECT

# ========================
# 规则引擎（rules）
# ========================
rules:
  # 局域网和明确的自定义规则优先。
  - RULE-SET,Private / Domain,DIRECT
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve
  - RULE-SET,Custom_Proxy_Domain / Domain,国外
  - RULE-SET,Custom_Direct_Domain / Domain,DIRECT
  - RULE-SET,Custom_Proxy_IP / Domain,国外,no-resolve
  - RULE-SET,Custom_Direct_IP / Domain,DIRECT,no-resolve
  - RULE-SET,Custom_Direct_Port / Domain,DIRECT
  - RULE-SET,Block / Domain,REJECT

  # Steam CDN 满速直连
  - RULE-SET,Steam_CDN_Domain / Domain,Steam_CDN_Domain
  - RULE-SET,Steam_CDN_IP / Domain,Steam_CDN_IP,no-resolve

  # 连通性测试
  - RULE-SET,Test / Domain,Test

  # AI 业务 (走 AI 美区策略组)
  - RULE-SET,ChatGPT / Domain,ChatGPT
  - RULE-SET,Claude / Domain,Claude
  - RULE-SET,Meta AI / Domain,Meta AI
  - RULE-SET,Perplexity / Domain,Perplexity
  - RULE-SET,Copilot / Domain,Copilot
  - RULE-SET,Gemini / Domain,Gemini
  - RULE-SET,Groq / Domain,ChatGPT
  - RULE-SET,Grok / Domain,ChatGPT
  - RULE-SET,AppleIntelligence / Domain,AppleIntelligence

  # 社交 / 通讯
